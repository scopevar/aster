updateNotifier: false
packages:
  - packages/*
overrides:
  "dompurify@<3.4.17": 3.4.17
  "esbuild@0.27.3": 0.28.2
  "fast-uri@3.1.8": 3.1.9
  "ip-address@10.7.2": 10.7.5
  # Mermaid and remark-math retain 0.16; share the app's patched rendering API.
  "katex@0.16.47": 0.18.9
  # Pi and its OpenAI client pin this transitive version exactly.
  "undici@8.10.2": 8.12.3
  "undici@7.30.0": 7.30.1
  "undici@6.29.0": 6.29.1
  "zod@4.6.5": 4.6.6
allowBuilds:
